<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word ke PDF - BantuSemua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mammoth.js untuk membaca file .docx di client-side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            #preview-container { border: none; box-shadow: none; padding: 0; width: 100%; }
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 font-sans">

    <div class="max-w-4xl mx-auto mb-6 flex justify-between items-center no-print">
        <a href="index.html" class="text-blue-600 font-medium hover:underline">&larr; Kembali ke Beranda</a>
        <button id="print-btn" onclick="window.print()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-blue-700 transition cursor-pointer hidden">
            🖨️ Cetak / Download PDF
        </button>
    </div>

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print">
            <h1 class="text-2xl font-bold mb-2">Word ke PDF</h1>
            <p class="text-slate-500 text-sm mb-4">Ubah dokumen Word (.docx) menjadi PDF secara aman langsung di perangkat Anda.</p>
            
            <input type="file" id="upload-docx" accept=".docx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
        </div>

        <!-- PRATINJAU DOKUMEN -->
        <div id="preview-container" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 min-h-[400px] text-slate-800 leading-relaxed">
            <p class="text-slate-400 italic text-center my-32">Unggah file .docx untuk melihat pratinjau di sini...</p>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('upload-docx');
        const previewContainer = document.getElementById('preview-container');
        const printBtn = document.getElementById('print-btn');

        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const arrayBuffer = e.target.result;
                try {
                    const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                    previewContainer.innerHTML = result.value;
                    printBtn.classList.remove('hidden');
                } catch (error) {
                    previewContainer.innerHTML = `<p class="text-rose-500">Gagal membaca file Word: ${error.message}</p>`;
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
