<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompres Foto - BantuSemua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Library Client-Side -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-8 max-w-2xl mx-auto">

    <a href="index.html" class="text-blue-500 mb-4 inline-block">&larr; Kembali ke Beranda</a>
    <h1 class="text-3xl font-bold mb-6">Alat Kompres Foto</h1>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <label class="block mb-2 font-medium">Pilih Foto (JPG/PNG):</label>
        <input type="file" id="upload-image" accept="image/*" class="mb-4 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        
        <p id="status" class="text-slate-500 text-sm mb-4">Belum ada foto yang diproses.</p>
        
        <div id="result-container" class="hidden">
            <h3 class="font-bold mb-2">Hasil Kompresi:</h3>
            <img id="compressed-image" class="max-w-full h-auto rounded border mb-4">
            <a id="download-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 cursor-pointer">Unduh Foto</a>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('upload-image');
        const statusText = document.getElementById('status');
        const resultContainer = document.getElementById('result-container');
        const compressedImage = document.getElementById('compressed-image');
        const downloadBtn = document.getElementById('download-btn');

        uploadInput.addEventListener('change', async function(event) {
            const imageFile = event.target.files[0];
            if (!imageFile) return;

            statusText.textContent = `Sedang memproses... Ukuran asli: ${(imageFile.size / 1024 / 1024).toFixed(2)} MB`;

            // Pengaturan kompresi client-side
            const options = {
                maxSizeMB: 0.5, // Target maksimal 500KB
                maxWidthOrHeight: 1920,
                useWebWorker: true
            };

            try {
                const compressedFile = await imageCompression(imageFile, options);
                statusText.textContent = `Berhasil! Ukuran baru: ${(compressedFile.size / 1024 / 1024).toFixed(2)} MB`;
                
                // Menampilkan hasil
                const imageUrl = URL.createObjectURL(compressedFile);
                compressedImage.src = imageUrl;
                
                // Mengatur tombol unduh
                downloadBtn.href = imageUrl;
                downloadBtn.download = `kompresi_${imageFile.name}`;
                
                resultContainer.classList.remove('hidden');
            } catch (error) {
                statusText.textContent = `Terjadi kesalahan: ${error.message}`;
            }
        });
    </script>
</body>
</html>
