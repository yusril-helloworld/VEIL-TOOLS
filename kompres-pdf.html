<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompres PDF - BantuSemua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 md:p-8 max-w-2xl mx-auto font-sans">

    <a href="index.html" class="text-blue-600 font-medium mb-6 inline-block hover:underline">&larr; Kembali ke Beranda</a>
    
    <h1 class="text-3xl font-bold mb-2">Alat Kompres PDF</h1>
    <p class="text-slate-500 mb-6">Kecilkan ukuran file PDF langsung di perangkat Anda tanpa diunggah ke server.</p>
    
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <label class="block mb-2 font-medium text-sm text-slate-700">Pilih File PDF:</label>
        <input type="file" id="upload-pdf" accept="application/pdf" class="mb-4 block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100 cursor-pointer">
        
        <button id="compress-btn" class="bg-red-600 text-white px-5 py-2.5 rounded-xl hover:bg-red-700 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed font-medium transition w-full md:w-auto" disabled>
            Kompres PDF Sekarang
        </button>
        
        <p id="status" class="text-slate-600 text-sm mt-4 hidden font-medium"></p>
        
        <div id="result-container" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-xl">
            <h3 class="font-bold text-green-800 mb-2">🎉 Kompresi Selesai!</h3>
            <a id="download-btn" class="bg-green-600 text-white px-4 py-2 rounded-xl hover:bg-green-700 cursor-pointer inline-block text-sm font-medium transition">Unduh PDF Terkompresi</a>
        </div>
    </div>

    <script>
        const uploadInput = document.getElementById('upload-pdf');
        const compressBtn = document.getElementById('compress-btn');
        const statusText = document.getElementById('status');
        const resultContainer = document.getElementById('result-container');
        const downloadBtn = document.getElementById('download-btn');
        
        let selectedFile = null;

        uploadInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                compressBtn.disabled = false;
                resultContainer.classList.add('hidden');
                statusText.classList.add('hidden');
            } else {
                compressBtn.disabled = true;
            }
        });

        compressBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            statusText.textContent = 'Memproses struktur PDF di perangkat Anda...';
            statusText.classList.remove('hidden');
            compressBtn.disabled = true;

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const { PDFDocument } = PDFLib;
                
                // Memuat dokumen PDF
                const pdfDoc = await PDFDocument.load(arrayBuffer);
                
                // Menyimpan ulang dengan object streams diaktifkan untuk optimasi ukuran
                const pdfBytes = await pdfDoc.save({ useObjectStreams: true });
                
                const blob = new Blob([pdfBytes], { type: 'application/pdf' });
                const url = URL.createObjectURL(blob);

                const oldSize = (selectedFile.size / 1024).toFixed(1);
                const newSize = (blob.size / 1024).toFixed(1);

                downloadBtn.href = url;
                downloadBtn.download = `kompres_${selectedFile.name}`;
                
                resultContainer.classList.remove('hidden');
                statusText.innerHTML = `Berhasil! Ukuran awal: <span class="font-bold">${oldSize} KB</span> &rarr; Ukuran baru: <span class="font-bold text-green-600">${newSize} KB</span>`;
            } catch (error) {
                statusText.textContent = 'Terjadi kesalahan: ' + error.message;
            } finally {
                compressBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
