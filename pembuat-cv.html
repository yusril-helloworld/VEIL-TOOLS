<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembuat CV ATS - BantuSemua</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white; padding: 0; }
            #cv-preview { border: none; box-shadow: none; padding: 0; width: 100%; }
            @page { margin: 1.5cm; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 p-4 md:p-8">

    <div class="max-w-6xl mx-auto mb-6 flex justify-between items-center no-print">
        <a href="index.html" class="text-blue-600 font-medium hover:underline">&larr; Kembali ke Beranda</a>
        <button onclick="window.print()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition cursor-pointer">
            🖨️ Cetak / Download PDF
        </button>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- FORM INPUT DATA CV (KOSONG / TANPA AUTO-INPUT) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 no-print space-y-4">
            <h2 class="text-xl font-bold mb-4">Isi Data Diri</h2>
            
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Lengkap</label>
                <input type="text" id="input-name" placeholder="Contoh: Yusril Maulana" class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Email</label>
                    <input type="email" id="input-email" placeholder="email@domain.com" class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nomor HP</label>
                    <input type="text" id="input-phone" placeholder="08123456789" class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Ringkasan Profil (Summary)</label>
                <textarea id="input-summary" rows="3" placeholder="Tulis ringkasan profil profesional Anda..." class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Pengalaman Kerja</label>
                <textarea id="input-experience" rows="4" placeholder="PT Maju Bersama - Software Engineer (2022 - Sekarang)&#10;• Poin uraian pekerjaan..." class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Pendidikan</label>
                <textarea id="input-education" rows="2" placeholder="S1 Teknik Informatika - Universitas..." class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Keahlian / Skills</label>
                <input type="text" id="input-skills" placeholder="JavaScript, Tailwind CSS, Public Speaking" class="w-full px-3 py-2 rounded-lg border text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
        </div>

        <!-- PREVIEW CV -->
        <div id="cv-preview" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-slate-900 leading-relaxed font-sans">
            <h1 id="pv-name" class="text-2xl font-bold uppercase tracking-wide border-b border-slate-900 pb-2 mb-2 text-slate-400">[ NAMA LENGKAP ]</h1>
            
            <p class="text-xs text-slate-400 mb-6 space-x-2">
                <span id="pv-email">[email@domain.com]</span> | 
                <span id="pv-phone">[nomor telepon]</span>
            </p>

            <div class="mb-5">
                <h2 class="text-xs font-bold uppercase tracking-wider border-b border-slate-300 pb-1 mb-2 text-slate-800">RINGKASAN PROFIL</h2>
                <p id="pv-summary" class="text-xs text-slate-400 italic">Belum diisi...</p>
            </div>

            <div class="mb-5">
                <h2 class="text-xs font-bold uppercase tracking-wider border-b border-slate-300 pb-1 mb-2 text-slate-800">PENGALAMAN KERJA</h2>
                <div id="pv-experience" class="text-xs text-slate-400 italic whitespace-pre-line">Belum diisi...</div>
            </div>

            <div class="mb-5">
                <h2 class="text-xs font-bold uppercase tracking-wider border-b border-slate-300 pb-1 mb-2 text-slate-800">PENDIDIKAN</h2>
                <div id="pv-education" class="text-xs text-slate-400 italic whitespace-pre-line">Belum diisi...</div>
            </div>

            <div>
                <h2 class="text-xs font-bold uppercase tracking-wider border-b border-slate-300 pb-1 mb-2 text-slate-800">KEAHLIAN</h2>
                <p id="pv-skills" class="text-xs text-slate-400 italic">Belum diisi...</p>
            </div>
        </div>

    </div>

    <!-- LOGIKA REALTIME PREVIEW -->
    <script>
        const bindInput = (inputId, previewId, defaultText) => {
            const input = document.getElementById(inputId);
            const preview = document.getElementById(previewId);
            
            input.addEventListener('input', () => {
                if (input.value.trim() === '') {
                    preview.textContent = defaultText;
                    preview.classList.add('text-slate-400', 'italic');
                    if (previewId === 'pv-name') preview.classList.remove('text-slate-900');
                } else {
                    preview.textContent = input.value;
                    preview.classList.remove('text-slate-400', 'italic');
                    if (previewId === 'pv-name') preview.classList.add('text-slate-900');
                }
            });
        };

        bindInput('input-name', 'pv-name', '[ NAMA LENGKAP ]');
        bindInput('input-email', 'pv-email', '[email@domain.com]');
        bindInput('input-phone', 'pv-phone', '[nomor telepon]');
        bindInput('input-summary', 'pv-summary', 'Belum diisi...');
        bindInput('input-experience', 'pv-experience', 'Belum diisi...');
        bindInput('input-education', 'pv-education', 'Belum diisi...');
        bindInput('input-skills', 'pv-skills', 'Belum diisi...');
    </script>
</body>
</html>
